name: Release

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Release tag (e.g., v1.1.1)'
        required: true
        type: string
      tag_title:
        description: 'Release title (e.g., v1.1.1@Y-M-D)'
        required: true
        type: string
      update_version:
        description: 'Do you want to update the version in the repository?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up version variables
        run: |
          VERSION=$(echo "${{ github.event.inputs.tag_version }}" | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update build.gradle version
        if: ${{ github.event.inputs.update_version == 'true' }}
        run: |
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" build.gradle
          CODE=$(grep -oP 'versionCode \K[0-9]+' build.gradle)
          sed -i "s/versionCode .*/versionCode $((CODE + 1))/" build.gradle

      - name: Regenerate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          version: "v2.13.1"
          config: cliff.toml
          # --tag labels the unreleased commits with the version being released;
          # without it they end up under an "unreleased" heading because the
          # tag itself is only created later by the release step.
          args: --tag ${{ github.event.inputs.tag_version }} -o CHANGELOG.md
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build and test
        run: python3 build.py

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: "v2.13.1"
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: BODY.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release header
        run: |
          sed -i '/^## \[unreleased\]/d' BODY.md
          printf "## What's Changed\n\n%s\n" "$(cat BODY.md)" > BODY.md

      - name: Write fastlane changelog
        if: ${{ github.event.inputs.update_version == 'true' }}
        run: |
          CODE=$(grep -oP 'versionCode \K[0-9]+' build.gradle)
          FILE="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          python3 - "$FILE" <<'EOF'
          import re, sys
          out = []
          for line in open("BODY.md"):
              line = line.strip()
              if not line.startswith("- "):
                  continue
              body = line[2:]
              body = re.sub(r"^\[[0-9a-f]{7}\]\([^)]*\)\s*", "", body)
              body = re.sub(r" in \[#[0-9]+\]\([^)]*\)", "", body)
              body = re.sub(r"\*\(([^)]*)\)\* ", "", body)
              body = re.sub(r"\[([^\]]*)\]\([^)]*\)", r"\1", body)
              body = re.sub(r" by @[A-Za-z0-9_.-]+", "", body)
              out.append(body.strip())
          open(sys.argv[1], "w").write("\n".join(out) + "\n")
          EOF
          echo "fastlane changelog for versionCode $CODE:"
          cat "$FILE"

      - name: Commit version changes
        if: ${{ github.event.inputs.update_version == 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add build.gradle CHANGELOG.md fastlane/
          git commit -m "chore(release): bump version"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_version }}
          name: ${{ github.event.inputs.tag_title }}
          draft: false
          prerelease: ${{ github.event.inputs.update_version != 'true' }}
          generate_release_notes: false
          body_path: BODY.md

      - name: Upload APK asset
        run: |
          sha256sum dist/npltz-android.apk > dist/npltz-android.apk.sha256
          gh release upload ${{ github.event.inputs.tag_version }} \
            dist/npltz-android.apk \
            dist/npltz-android.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

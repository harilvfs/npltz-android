plugins {
    id "com.android.application" version "9.5.1"
}

android {
    namespace "com.harilvfs.npltz"
    compileSdk 35
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.harilvfs.npltz"
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName "1.2.0"

        // strip every locale the material libraries bundle except english
        // and nepali, the app translates strings itself at runtime.
        androidResources {
            localeFilters += ["en", "ne"]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["src"]
            res.srcDirs = ["res"]
            assets.srcDirs = ["assets"]
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "com.google.android.material:material:1.13.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
}

def calendarJson = file("data/calendar_data.json")
def calendarSource = file("src/com/harilvfs/npltz/CalendarData.java")
def changelogFile = file("CHANGELOG.md")

tasks.register("generateCalendarData", Exec) {
    inputs.file(calendarJson)
    outputs.file(calendarSource)
    commandLine "python3", "tools/gen_calendar_data.py", calendarJson, calendarSource
}

tasks.register("copyCalendarAsset", Copy) {
    from calendarJson
    into "assets"
}

tasks.register("copyChangelogAsset", Copy) {
    onlyIf { changelogFile.exists() }
    from changelogFile
    into "assets"
    rename { "changelog.md" }
}

tasks.named("preBuild").configure {
    dependsOn "generateCalendarData", "copyCalendarAsset", "copyChangelogAsset"
}

def appClasses = layout.buildDirectory.dir(
    "intermediates/javac/debug/compileDebugJavaWithJavac/classes"
)

tasks.register("compileCoreTest", JavaCompile) {
    dependsOn "compileDebugJavaWithJavac"
    source = file("tools/CoreTest.java")
    classpath = files(appClasses)
    destinationDirectory.set(layout.buildDirectory.dir("classes/coreTest"))
    options.encoding = "UTF-8"
    options.release = 11
}

tasks.register("coreTest", JavaExec) {
    group = "verification"
    description = "Runs the calendar conversion checks on the JVM."
    dependsOn "compileCoreTest"
    classpath = files(layout.buildDirectory.dir("classes/coreTest"), appClasses)
    mainClass = "CoreTest"
}

tasks.register("apk") {
    group = "build"
    description = "Builds the debug APK and copies it to dist/npltz-android.apk."
    dependsOn "assembleDebug"
    doLast {
        copy {
            from layout.buildDirectory.file("outputs/apk/debug/npltz-android-debug.apk")
            into "dist"
            rename { "npltz-android.apk" }
        }
    }
}
